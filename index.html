<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VISCERA — microbot prototype</title>
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>

      <div id="hud" class="hud">
        <div class="hud-row">
          <span class="hud-label">HP</span>
          <div class="hp-track">
            <div id="hp-fill" class="hp-fill"></div>
          </div>
          <span id="hp-text" class="hud-value">100</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">KILLS</span>
          <span id="kills-text" class="hud-value">0</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">MOTES</span>
          <span id="motes-text" class="hud-value mote">0</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">LEVEL</span>
          <span id="level-text" class="hud-value">1</span>
          <div class="xp-track">
            <div id="xp-fill" class="xp-fill"></div>
          </div>
          <span id="xp-text" class="hud-value xp">0/6</span>
        </div>
        <div class="hud-row">
          <button id="colony-btn" type="button" class="hud-btn">Colony (0/5)</button>
        </div>
        <div class="hud-hint">WASD / arrows — move · auto-attack nearest</div>
        <div id="seed-text" class="hud-seed">seed —</div>
      </div>

      <div id="minimap-wrap">
        <canvas id="minimap" width="220" height="220"></canvas>
      </div>

      <div id="gameover" class="gameover hidden">
        <div class="gameover-card">
          <h1>GAME OVER</h1>
          <p>Microbot destroyed.</p>
          <p class="gameover-stats">Kills: <span id="final-kills">0</span> · Motes: <span id="final-motes">0</span></p>
          <button id="restart-btn" type="button">Restart</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
