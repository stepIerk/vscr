<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VISCERA — microbot prototype</title>
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>

      <div id="hud" class="hud">
        <div class="hud-row">
          <span class="hud-label">ЗДР</span>
          <div class="hp-track">
            <div id="hp-fill" class="hp-fill"></div>
          </div>
          <span id="hp-text" class="hud-value">100</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Фраги</span>
          <span id="kills-text" class="hud-value">0</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Биомасса</span>
          <span id="motes-text" class="hud-value mote">0</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Плазма</span>
          <span id="plasma-text" class="hud-value plasma">0</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Уровень</span>
          <span id="level-text" class="hud-value">1</span>
          <div class="xp-track">
            <div id="xp-fill" class="xp-fill"></div>
          </div>
          <span id="xp-text" class="hud-value xp">0/6</span>
        </div>
        <div class="hud-row hud-buttons">
          <button id="colony-btn" type="button" class="hud-btn">Колония (0/5)</button>
          <button id="artifacts-btn" type="button" class="hud-btn">Артефакты (0/5)</button>
        </div>
        <div id="hud-hint" class="hud-hint">WASD / стрелки — движение · атака сама · E — купить у стенда</div>
        <div id="seed-text" class="hud-seed">seed —</div>
      </div>

      <div id="colony-side" class="colony-side hidden"></div>

      <div id="touch-ui" class="touch-ui hidden">
        <div id="joy" class="joy"><div id="joy-knob" class="joy-knob"></div></div>
        <button id="act-btn" type="button" class="act-btn">E</button>
      </div>

      <div id="minimap-wrap">
        <canvas id="minimap" width="220" height="220"></canvas>
      </div>

      <div id="boss-bar" class="boss-bar hidden">
        <div id="boss-name" class="boss-name">БОСС</div>
        <div class="boss-track">
          <div id="boss-fill" class="boss-fill"></div>
        </div>
      </div>

      <div id="toast" class="toast hidden"></div>

      <div id="gameover" class="gameover hidden">
        <div class="gameover-card">
          <h1>ИГРА ОКОНЧЕНА</h1>
          <p>Микробот уничтожен.</p>
          <p class="gameover-stats">Фраги: <span id="final-kills">0</span> · Биомасса: <span id="final-motes">0</span></p>
          <button id="restart-btn" type="button">Заново</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
